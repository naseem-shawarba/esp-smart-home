; ESP-Guard alarm node
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I include
	-D DEVICE_DEFAULT_NODE_ID=1
	'-D DEVICE_DEFAULT_NAME="Door"'
lib_extra_dirs =
	../../shared
lib_deps =
	witnessmenow/UniversalTelegramBot@^1.3.0
	pangodream/ESP2SOTA@^1.0.2
	esp32async/ESPAsyncWebServer@^3.11.1
