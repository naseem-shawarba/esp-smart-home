; ESP-Guard weather node (ESP32-C3)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D DEVICE_DEFAULT_NODE_ID=10
	'-D DEVICE_DEFAULT_NAME="Weather"'
	; I2C pins for the BMP280/BME280 (and OLED optional)
	-D WEATHER_SDA=5
	-D WEATHER_SCL=6
	-D WEATHER_SLEEP_SEC=600
	'-D DEFAULT_POST_URL=""'
	; Uncomment to drive an SSD1306 OLED:
	-D WEATHER_OLED=1
	-D WEATHER_OLED_ADDR=0x3C
	-D PORTAL_PIN=9
	-D BUILTIN_LED_PIN=8
lib_extra_dirs =
	../../shared
lib_deps =
	pangodream/ESP2SOTA@^1.0.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit AHTX0 @ ^2.0.6
