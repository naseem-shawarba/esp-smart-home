; ESP-Guard simple guard node (ESP32-C3) — battery door sensor.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D DEVICE_DEFAULT_NODE_ID=1
	'-D DEVICE_DEFAULT_NAME="Simple Guard"'
	; Reed-switch GPIO. On ESP32-C3, deep-sleep wake is only possible on GPIO0-5.
	-D GUARD_SDA=5
	-D GUARD_SCL=6
	-D DOOR_PIN=3
	; On-board BOOT button (held at power-on) re-opens the setup portal.
	-D PORTAL_PIN=9
	-D BUILTIN_LED_PIN=8
	-D GUARD_OLED=1
	-D GUARD_OLED_ADDR=0x3C
lib_extra_dirs =
	../../shared
lib_deps =
	pangodream/ESP2SOTA@^1.0.2
	witnessmenow/UniversalTelegramBot@^1.3.0
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11